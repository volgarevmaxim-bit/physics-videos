name: Update available videos

on:
  schedule:
    - cron: '5 0 * * *' # каждый день в 00:05 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-available:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data files
        run: npm ci && npm run validate

      - name: Generate available.json
        run: node scripts/update-available.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/available.json
          git diff --cached --quiet || git commit -m "Update available videos for $(date -u +%F)"
          git push
