<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мои видео — Физика</title>
<style>
  :root {
    --accent: #3b82f6;
    --bg: #0b0b0f;
    --card: #16161d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  .video-frame-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 */
    background: #000;
  }
  .video-frame-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  select#videoSelect {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font-size: 1.1rem;
    background: var(--card);
    color: #fff;
    border: none;
    border-bottom: 2px solid var(--accent);
    appearance: none;
    -webkit-appearance: none;
  }
  select#videoSelect option:disabled {
    color: #666;
  }
  .list-panel {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .video-item {
    flex: 0 0 auto;
    background: var(--card);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: #eee;
    cursor: pointer;
    white-space: nowrap;
  }
  .video-item.active {
    border-color: var(--accent);
    background: #1d2b45;
  }
  .video-item.locked {
    color: #666;
    cursor: not-allowed;
    background: #101014;
  }
  .questions-panel {
    padding: 4px 16px 24px;
  }
  .questions-panel h2 {
    font-size: 1.05rem;
    margin: 10px 0 8px;
    color: #cbd5ff;
  }
  .questions-panel ol {
    margin: 0;
    padding-left: 20px;
  }
  .questions-panel li {
    margin-bottom: 8px;
    font-size: 1rem;
    line-height: 1.4;
  }
  .lock-note {
    text-align: center;
    padding: 16px;
    color: #999;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<div class="video-frame-wrap">
  <iframe id="player"
          src=""
          allow="clipboard-write; autoplay"
          allowfullscreen
          webkitallowfullscreen
          mozallowfullscreen></iframe>
</div>

<select id="videoSelect"></select>
<div class="list-panel" id="videoList"></div>
<div class="questions-panel" id="questionsPanel"></div>

<script>
let videos = [];
let unlockedIndices = [];

const playerEl = document.getElementById('player');
const selectEl = document.getElementById('videoSelect');
const listEl = document.getElementById('videoList');
const questionsEl = document.getElementById('questionsPanel');

function buildEmbedUrl(v) {
  return `https://rutube.ru/play/embed/${v.id}`;
}

function isUnlocked(index) {
  return unlockedIndices.includes(index);
}

function renderQuestions(index) {
  const v = videos[index];
  if (!v || !v.questions || v.questions.length === 0) {
    questionsEl.innerHTML = '';
    return;
  }
  const items = v.questions.map(q => `<li>${q}</li>`).join('');
  questionsEl.innerHTML = `<h2>Подумай и обсуди:</h2><ol>${items}</ol>`;
}

function playVideo(index) {
  if (!isUnlocked(index)) return;
  const v = videos[index];
  playerEl.src = buildEmbedUrl(v);
  selectEl.value = index;
  document.querySelectorAll('.video-item').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  renderQuestions(index);
}

function render() {
  selectEl.innerHTML = '';
  listEl.innerHTML = '';

  videos.forEach((v, i) => {
    const unlocked = isUnlocked(i);

    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = unlocked ? v.title : `🔒 ${v.title}`;
    opt.disabled = !unlocked;
    selectEl.appendChild(opt);

    const item = document.createElement('div');
    item.className = 'video-item' + (unlocked ? '' : ' locked');
    item.textContent = unlocked ? v.title : `🔒 ${v.title}`;
    if (unlocked) {
      item.addEventListener('click', () => playVideo(i));
    }
    listEl.appendChild(item);
  });

  const defaultIndex = unlockedIndices.length
    ? unlockedIndices[unlockedIndices.length - 1]
    : 0;
  if (unlockedIndices.length) {
    playVideo(defaultIndex);
  } else {
    questionsEl.innerHTML = '<div class="lock-note">Новое видео появится совсем скоро 🙂</div>';
  }
}

selectEl.addEventListener('change', () => playVideo(Number(selectEl.value)));

Promise.all([
  fetch('videos.json').then(r => r.json()),
  fetch('available.json').then(r => r.json()).catch(() => null)
]).then(([videosData, availableData]) => {
  videos = videosData;
  if (availableData && Array.isArray(availableData.unlockedIndices)) {
    unlockedIndices = availableData.unlockedIndices;
  } else {
    // Резервный вариант, если available.json недоступен: открыто только первое видео.
    unlockedIndices = [0];
  }
  render();
});
</script>

</body>
</html>
