<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мои видео — Физика</title>
<style>:root{--accent:#3b82f6;--bg:#0b0b0f;--card:#16161d}*{box-sizing:border-box}html,body{background:var(--bg);color:#eee;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}.video-frame-wrap{background:#000;width:100%;padding-top:56.25%;position:relative}.video-frame-wrap iframe{border:0;width:100%;height:100%;position:absolute;top:0;left:0}select#videoSelect{background:var(--card);color:#fff;border:none;border-bottom:2px solid var(--accent);appearance:none;width:100%;padding:14px 16px;font-size:1.1rem;display:block}select#videoSelect option:disabled{color:#666}.list-panel{-webkit-overflow-scrolling:touch;scrollbar-width:thin;gap:8px;padding:10px;display:flex;overflow-x:auto}.video-item{background:var(--card);color:#eee;cursor:pointer;white-space:nowrap;border:2px solid #0000;border-radius:10px;flex:none;padding:10px 14px;font-size:.95rem}.video-item.active{border-color:var(--accent);background:#1d2b45}.video-item.locked{color:#666;cursor:not-allowed;background:#101014}.video-item.rewatch{opacity:.8;border-color:#444}.questions-panel{padding:4px 16px 24px}.questions-panel h2{color:#cbd5ff;margin:10px 0 8px;font-size:1.05rem}.questions-panel ol{margin:0;padding-left:20px}.questions-panel li{margin-bottom:8px;font-size:1rem;line-height:1.4}.lock-note{text-align:center;color:#999;padding:16px;font-size:.95rem}#profileGate{background:var(--bg);z-index:1000;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;display:none;position:fixed;top:0;left:0}#profileGate.visible{display:flex}.profile-gate-title{color:#eee;margin-bottom:24px;font-size:1.8rem}.profile-cards{flex-wrap:wrap;justify-content:center;gap:20px;display:flex}.profile-card{background:var(--card);color:#eee;cursor:pointer;-webkit-user-select:none;user-select:none;border:2px solid #0000;border-radius:16px;padding:40px 52px;font-size:1.4rem;transition:border-color .2s,background .2s}.profile-card:hover{border-color:var(--accent);background:#1d2b45}.utility-bar{align-items:center;gap:8px;min-height:40px;padding:8px 12px;display:flex}.hamburger-btn{cursor:pointer;background:0 0;border:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:40px;height:40px;margin-left:auto;padding:0;display:flex}.hamburger-btn span{background:#888;border-radius:1px;width:22px;height:2px;transition:background .2s;display:block}.hamburger-btn:hover span{background:#eee}</style>
  <script type="module" crossorigin src="./assets/app.js"></script>
</head>
<body>

<div id="profileGate">
  <div class="profile-gate-title">Кто будет смотреть?</div>
  <div id="profileCards" class="profile-cards"></div>
</div>

<div class="utility-bar">
  <!-- Служебная полоса над видео: пока только гамбургер справа, место под будущие элементы -->
  <button id="switchProfileBtn" class="hamburger-btn" aria-label="Меню" title="Сменить профиль">
    <span></span><span></span><span></span>
  </button>
</div>

<div class="video-frame-wrap">
  <iframe id="player"
          src=""
          allow="clipboard-write; autoplay"
          allowfullscreen
          webkitallowfullscreen
          mozallowfullscreen></iframe>
</div>

<select id="videoSelect"></select>
<div class="list-panel" id="videoList"></div>
<div class="questions-panel" id="questionsPanel"></div>


</body>
</html>
