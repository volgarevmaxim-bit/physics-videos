<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мои видео — Физика</title>
<style>
  :root {
    --accent: #3b82f6;
    --bg: #0b0b0f;
    --card: #16161d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  .video-frame-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 */
    background: #000;
  }
  .video-frame-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  select#videoSelect {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font-size: 1.1rem;
    background: var(--card);
    color: #fff;
    border: none;
    border-bottom: 2px solid var(--accent);
    appearance: none;
    -webkit-appearance: none;
  }
  select#videoSelect option:disabled {
    color: #666;
  }
  .list-panel {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .video-item {
    flex: 0 0 auto;
    background: var(--card);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: #eee;
    cursor: pointer;
    white-space: nowrap;
  }
  .video-item.active {
    border-color: var(--accent);
    background: #1d2b45;
  }
  .video-item.locked {
    color: #666;
    cursor: not-allowed;
    background: #101014;
  }
  .video-item.rewatch {
    border-color: #444;
    opacity: 0.8;
  }
  .questions-panel {
    padding: 4px 16px 24px;
  }
  .questions-panel h2 {
    font-size: 1.05rem;
    margin: 10px 0 8px;
    color: #cbd5ff;
  }
  .questions-panel ol {
    margin: 0;
    padding-left: 20px;
  }
  .questions-panel li {
    margin-bottom: 8px;
    font-size: 1rem;
    line-height: 1.4;
  }
  .lock-note {
    text-align: center;
    padding: 16px;
    color: #999;
    font-size: 0.95rem;
  }

  /* ---- Profile Gate ---- */
  #profileGate {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #profileGate.visible { display: flex; }
  .profile-gate-title {
    font-size: 1.8rem;
    margin-bottom: 24px;
    color: #eee;
  }
  .profile-cards {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .profile-card {
    background: var(--card);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 40px 52px;
    font-size: 1.4rem;
    color: #eee;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
  }
  .profile-card:hover {
    border-color: var(--accent);
    background: #1d2b45;
  }

  /* ---- Switch Profile Button ---- */
  #switchProfileBtn {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 500;
    background: var(--card);
    color: #888;
    border: 1px solid #333;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: color 0.2s;
  }
  #switchProfileBtn:hover {
    color: #eee;
    border-color: #555;
  }
</style>
</head>
<body>

<div id="profileGate">
  <div class="profile-gate-title">Кто будет смотреть?</div>
  <div id="profileCards" class="profile-cards"></div>
</div>

<button id="switchProfileBtn">Сменить профиль</button>

<div class="video-frame-wrap">
  <iframe id="player"
          src=""
          allow="clipboard-write; autoplay"
          allowfullscreen
          webkitallowfullscreen
          mozallowfullscreen></iframe>
</div>

<select id="videoSelect"></select>
<div class="list-panel" id="videoList"></div>
<div class="questions-panel" id="questionsPanel"></div>

<script type="module" src="/main.js"></script>

</body>
</html>
